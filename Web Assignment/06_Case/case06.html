<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="web, html, css, javascript, js, java, python">
    <meta name="description" content="World best web development tutorials">
    <meta name="author" content="IJSE">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Case_06</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <link rel="stylesheet" href="../assets/lib/normalize.css">
    <link rel="stylesheet" href="https://www.hxstrive.com/cdn/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        main {
            width: 100vw;
            height: 100vh;
            background-image: url("../assets/Car_Animation_Img/sky.jpg");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            overflow: hidden;
            position: relative;
        }

        main > #mainFrame {
            position: relative;
            width: 300vw;
            height: 100%;
            display: flex;
            flex-direction: row;
            animation: frameAnimation 6000ms linear infinite;
            overflow: hidden;
        }

        main > section > section {
            position: relative;
            width: 100vw;
        }

        .city {
            position: absolute;
            width: 100%;
            height: calc(100vh / 3);
            background-image: url("../assets/Car_Animation_Img/city.png");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            bottom: 33vh;
        }

        .road {
            width: 100%;
            height: calc(100vh / 3);
            background-image: url("../assets/Car_Animation_Img/road.jpg");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            position: absolute;
            bottom: 0;
        }

        /* Car + Wheels container */
        #carContainer {
            position: absolute;
            bottom: 140px;
            left: 40vw;
            width: calc(100vh / 2);
        }

        #carBody {
            width: 100%;
            display: block;
        }

        .wheels {
            width: 18%;                 /* relative to car width – looks better */
            position: absolute;
            bottom: 8%;                 /* adjust this if needed */
            animation: wheelAnimation 600ms linear infinite;
        }

        #wheel1 {                       /* Front wheel */
            left: 70%;
            bottom: 5%;
        }

        #wheel2 {                       /* Rear wheel */
            left: 8.5%;
            bottom: 5%;
        }

        @keyframes frameAnimation {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-200vw);
            }
        }

        @keyframes wheelAnimation {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
<main>
    <section id="mainFrame">
        <section class="frame">
            <section class="city"></section>
            <section class="road"></section>
        </section>
        <section class="frame">
            <section class="city"></section>
            <section class="road"></section>
        </section>
        <section class="frame">
            <section class="city"></section>
            <section class="road"></section>
        </section>
    </section>

    <!-- Car + Wheels together -->
    <div id="carContainer">
        <img id="carBody" src="../assets/Car_Animation_Img/car.png" alt="car">
        <img id="wheel1" class="wheels" src="../assets/Car_Animation_Img/wheel.png" alt="wheel">
        <img id="wheel2" class="wheels" src="../assets/Car_Animation_Img/wheel.png" alt="wheel">
    </div>
</main>
</body>
</html>
